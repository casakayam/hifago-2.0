name: hifago-ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Le GITHUB_TOKEN n'a besoin que de lire le code : aucun job ici ne publie, ne commente ni ne
# pousse quoi que ce soit. Sans ce bloc, il hérite du réglage du dépôt, souvent permissif.
permissions:
  contents: read

# Deux pushs rapprochés : le run du premier est annulé plutôt que de payer une seconde stack
# Supabase pour un état de main déjà dépassé.
concurrency:
  group: hifago-ci-${{ github.ref }}
  cancel-in-progress: true

# Actions épinglées par SHA de commit (le commentaire donne la version lisible) : un tag comme
# `v4` est déplaçable, donc une action compromise en amont s'exécuterait ici sans qu'un seul
# commit ne change de ce côté.
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint --workspaces --if-present
      # Bloquant depuis le 2026-08-28 : le script tourne propre, et il couvre le piège
      # Table.Body/Table.Content non sérialisable que le lint no-restricted-imports ne voit pas.
      - name: Design system (HeroUI unique, composants sérialisables)
        run: bash scripts/check-design-system.sh
      # Bloquant depuis le 2026-08-28. La règle eslint (eslint.rules.mjs) ne couvre que les deux
      # apps ; ce script couvre packages/, supabase/functions/ (Deno), tests/ et le SQL — c'est-à-
      # dire l'angle mort où vivait le dixième site du lot fuseau (packages/e2e-support/src/date.ts).
      - name: Fuseau de Guatapé (aucune date civile calculée en UTC)
        run: bash scripts/check-timezone.sh
      # Deux règles SEO que la relecture ne peut pas attraper : l'une porte sur une ABSENCE
      # (aucune table d'avis n'existe, donc aucune note ne doit être émise), l'autre sur deux
      # écritures visuellement identiques dont une seule échappe réellement le JSON-LD. Les deux
      # branches du script ont été vérifiées PAR MUTATION, pas seulement observées vertes.
      - name: Référencement (données structurées honnêtes, JSON-LD échappé)
        run: bash scripts/check-seo.sh
      # Le manifeste docs/ai-index.json est ce que lisent les agents pour s'orienter : périmé, il
      # les envoie lire le mauvais document. `npm run docs:index` le régénère.
      - name: Manifeste documentaire à jour
        run: npm run docs:check
      # `--omit=dev` depuis le 2026-09-01, décision de Jérôme, avec sa raison et son coût.
      # RAISON : l'installation de Storybook (outil de playground local, jamais déployé) fait
      # entrer 3 avis `high` sur `image-size` — déni de service par boucle infinie sur des parsers
      # ICNS/JXL/HEIF — via `vite-plugin-storybook-nextjs`. `No fix available` : aucune version
      # corrigée n'existe, donc ni `npm audit fix` ni un `overrides` ne peuvent y répondre.
      # CE QU'ON PERD, et il faut le savoir : ce job ne contrôle plus AUCUNE dépendance de
      # développement, pas seulement celle-ci. Il audite désormais ce qui est réellement déployé.
      # À REVOIR : si `image-size` publie un correctif, retirer `--omit=dev` et revenir à l'audit
      # complet — c'est le seul motif de cette restriction.
      - name: Dépendances de production sans vulnérabilité haute ou critique
        run: npm audit --omit=dev --audit-level=high
      # Non bloquant, et c'est le but : l'étape ci-dessus ne regarde plus les devDependencies, donc
      # une NOUVELLE faille dans vitest, playwright, eslint ou storybook passerait totalement
      # inaperçue. Cette étape la laisse au moins visible dans les logs. Elle échouera tant que
      # `image-size` n'aura pas de correctif — c'est attendu, ne pas la « réparer » en la retirant.
      - name: Dépendances de développement — angle mort, pour information seulement
        run: npm audit --audit-level=high || true

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck --workspaces --if-present

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test --workspaces --if-present

  # Scan de secrets sur tout l'historique, pas seulement sur le dernier diff : un secret
  # introduit puis « retiré » par un commit suivant reste extractible du dépôt. Les détections
  # déjà auditées vivent dans .gitleaksignore, à la racine.
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pas de commentaire automatique sur les PR : ça demanderait `pull-requests: write`,
          # et le compte casakayam est un compte personnel, donc pas de licence à fournir.
          GITLEAKS_ENABLE_COMMENTS: false

  # Garde-fou base de données. C'est ici que tournent les 44 fichiers pgTAP, dont
  # rls_rpc_only_checklist.test.sql, qui vérifie sur TOUT le schéma public que chaque fonction
  # SECURITY DEFINER fixe search_path='', qu'aucune fonction appelée dans une policy n'est
  # VOLATILE, et que auth.uid() est toujours enveloppé.
  db:
    needs: [lint, typecheck, unit]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # GoTrue démarre avec [auth.external.google].enabled = true : deux valeurs bidon lui
      # évitent de booter sur une configuration vide. Aucun test ici ne passe par Google.
      SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID: ci-dummy.apps.googleusercontent.com
      SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET: ci-dummy
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1
        # Version figée, jamais `latest` : sinon une release de la CLI casse la CI un mardi
        # matin sans qu'aucun commit de ce dépôt n'ait bougé.
        with:
          version: 2.116.0
      # Pas de seed ici, et ce n'est pas un raccourci : aucun des 44 fichiers pgTAP ne référence
      # un UUID ou un e-mail de seed.sql, et plusieurs comptent des lignes en absolu
      # (`select count(*) from audit_log` = 0). Ils EXIGENT une base vierge non seedée — c'est
      # d'ailleurs pourquoi ils échouent sur une base de dev vivante. Le seed reste nécessaire
      # aux tests de concurrence, qui viendront dans leur propre job.
      - run: supabase start
      - run: supabase test db
      # Restreint à `public` : le schéma `extensions` contient les fonctions de pgTAP
      # elles-mêmes, dont l'analyse statique remonte des erreurs qui ne sont pas les nôtres
      # (proisagg, spclocation, __tcache__ — vérifié le 2026-08-27).
      - run: supabase db lint --schema public --level error --fail-on error

  # Les 4 Edge Functions n'avaient JAMAIS été typecheckées — ni le typecheck des workspaces ni le
  # lint ne les voient (elles tournent sous Deno, hors du monorepo npm). Le premier passage a trouvé
  # un `ReturnType<typeof createClient>` qui résolvait les génériques par défaut et désactivait
  # silencieusement la vérification des arguments de deux `rpc()`.
  functions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.x
      # Depuis la RACINE : les fonctions importent packages/domain en chemin relatif, un check
      # lancé depuis supabase/functions ne résout pas ces modules et fabrique de fausses erreurs.
      # --node-modules-dir=auto : le runner n'a pas de node_modules (ce job ne fait pas de
      # `npm ci`), et la présence d'un package.json à la racine met Deno en mode node_modules,
      # où il refuse de résoudre npm:@supabase/supabase-js tout seul.
      - run: deno check --node-modules-dir=auto supabase/functions/*/index.ts

  # Preuve concurrente anti-survente (barrière de synchronisation, driver `pg` direct). Contrairement
  # au job `db`, celui-ci a besoin du seed : 6 des 10 tests s'appuient sur des données seedées.
  concurrence:
    needs: [db]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_BIN: supabase
      SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID: ci-dummy.apps.googleusercontent.com
      SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET: ci-dummy
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1
        with:
          version: 2.116.0
      - run: supabase start
      # Les trois étapes ordonnées : reset sans seed, comptes auth via l'API Admin, puis seed.sql.
      - run: npm run db:setup
      - run: npm run test:concurrency

  build:
    needs: [db]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Valeurs FACTICES, assumées : ce job vérifie que le code compile, pas qu'il est configuré —
    # les vraies valeurs vivent dans Vercel, qui refait son propre build avec son propre
    # environnement. Sans NEXT_PUBLIC_WEB_APP_URL, apps/admin échoue à la collecte de
    # /partner/tools, qui la lit au niveau module et lève. C'est le seul throw au build des deux
    # apps (celui de mercadopago/client.ts est dans une fonction, donc paresseux).
    env:
      NEXT_PUBLIC_WEB_APP_URL: https://ci.invalid
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-dummy-anon-key
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build --workspaces --if-present

  # Étapes volontairement absentes tant que les ressources cloud n'existent pas
  # (cf. CLAUDE.md § 8 et le skill /hifago-init) : déploiement preview
  # Vercel → E2E Playwright contre le vrai déploiement preview (déclenché par
  # l'événement `deployment_status`, en-têtes de contournement de Deployment
  # Protection) → déploiement `staging` + smoke test → promotion manuelle vers
  # la prod via GitHub Environments avec approbateurs requis. À brancher une
  # fois `hifago-provision-cloud` exécuté.
