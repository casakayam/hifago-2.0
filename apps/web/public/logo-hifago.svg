<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 132 32" role="img" aria-label="hifago">
  <!--
    Logo PROVISOIRE (2026-09-02, vague 4) : le vrai n'existe pas encore, celui-ci porte le mot en
    toutes lettres pour ne pas bloquer le header.

    `fill="currentColor"` : il doit tenir en clair comme en sombre. ⚠️ Cette couleur n'est héritée
    QUE si le SVG est inliné dans le document — chargé via <img src> ou next/image, il devient un
    document isolé et retombe sur le noir. C'est pourquoi le header inline le même tracé plutôt que
    de pointer ce fichier ; celui-ci existe pour les usages hors DOM (favicon, image OG, partage).
  -->
  <text x="0" y="24" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"
        font-size="26" font-weight="600" letter-spacing="-0.5" fill="currentColor">hifago</text>
</svg>
