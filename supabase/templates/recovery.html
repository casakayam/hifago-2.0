<h2>Restablece tu contraseña en Hifago</h2>
<p>Sigue este enlace para elegir una nueva contraseña. Vale una hora y se usa una sola vez:</p>
<p><a href="http://localhost:3101/auth/callback?token_hash={{ .TokenHash }}&type=recovery&next=/reset-password">Restablecer contraseña</a></p>
<p>Si no lo pediste tú, puedes ignorar este correo — tu contraseña actual sigue siendo válida.</p>
