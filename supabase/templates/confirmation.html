<!-- Feature 32 : lien dynamique par app plutôt que codé en dur sur apps/admin (port 3101). Tout
     appelant signUp() (apps/admin ou apps/web) DOIT passer options.emailRedirectTo construit via
     `new URL(...).searchParams.set("next", ...)` (jamais une URL nue) — {{ .RedirectTo }} retombe
     sinon sur site_url SANS query string, ce qui casserait le "&token_hash=..." qui suit. Contrat
     vérifié empiriquement (smoke-test Inbucket) avant de bâtir le reste de l'inscription client. -->
<h2>Confirma tu cuenta en Hifago</h2>
<p>Sigue este enlace para confirmar tu cuenta y empezar a usar Hifago:</p>
<p><a href="{{ .RedirectTo }}&token_hash={{ .TokenHash }}&type=signup">Confirmar mi cuenta</a></p>
<p>Si no creaste esta cuenta, puedes ignorar este correo.</p>
